<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRAS PARTS — Каталог запчастей для сельскохозяйственных дронов DJI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="container header-container">
            <div class="logo">
                <i class="fa-solid fa-helicopter"></i>
                <span>AGRAS <strong>PARTS</strong></span>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Поиск по наименованию или артикулу...">
                <button id="searchBtn"><i class="fa-solid fa-magnifyingGlass"></i></button>
            </div>
            <div class="cart-icon" id="cartToggle">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="cartCount">0</span>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="container main-layout">
        <!-- Боковая панель фильтров -->
        <aside class="filters">
            <h3>Фильтры</h3>
            <div class="filter-group">
                <label for="categorySelect">Категория / Узел:</label>
                <select id="categorySelect">
                    <option value="all">Все категории</option>
                    <option value="shassi">Шасси и рама</option>
                    <option value="luchi">Лучи и подвеска</option>
                    <option value="motors">Моторы и двигатели</option>
                    <option value="electronics">Электроника и антенны</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="sortSelect">Сортировка:</label>
                <select id="sortSelect">
                    <option value="default">По умолчанию</option>
                    <option value="price-asc">Цена: по возрастанию</option>
                    <option value="price-desc">Цена: по убыванию</option>
                </select>
            </div>
            <button id="resetFilters" class="btn-secondary">Сбросить фильтры</button>
        </aside>

        <!-- Сетка товаров -->
        <section class="catalog-section">
            <div class="catalog-header">
                <h2>Каталог запчастей DJI Agras</h2>
                <span id="productCount">Найдено позиций: 0</span>
            </div>
            <div id="productGrid" class="product-grid">
                <!-- Карточки товаров генерируются через JS -->
            </div>
        </section>
    </main>

    <!-- Модальное окно корзины -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Корзина заказа</h3>
                <button class="close-btn" id="closeCart">&times;</button>
            </div>
            <div class="modal-body" id="cartItemsList">
                <!-- Товары в корзине -->
            </div>
            <div class="modal-footer">
                <div class="cart-total">Итого: <span id="cartTotalPrice">0</span> ₽</div>
                <button class="btn-primary" id="checkoutBtn">Оформить заказ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
