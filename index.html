const fmt=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:2}).format(n);
let cart=JSON.parse(localStorage.getItem('agrasCart')||'{}');
const q=document.querySelector('#q'),cat=document.querySelector('#cat'),sort=document.querySelector('#sort');
const cats=[...new Set(parts.map(x=>x.category))].sort();
cats.forEach(c=>{cat.insertAdjacentHTML('beforeend',`<option>${c}</option>`);});
function renderCats(){document.querySelector('#cats').innerHTML=cats.map(c=>`<div class="cat" onclick="cat.value=${JSON.stringify(c)};render()">${c}<b>${parts.filter(x=>x.category===c).length}</b></div>`).join('')}
function render(){let a=parts.filter(x=>{let s=(x.sku+' '+x.name+' '+x.name_en).toLowerCase();return s.includes(q.value.toLowerCase())&&(!cat.value||x.category===cat.value)});
if(sort.value==='priceUp')a.sort((x,y)=>x.price-y.price);if(sort.value==='priceDown')a.sort((x,y)=>y.price-x.price);if(sort.value==='name')a.sort((x,y)=>x.name.localeCompare(y.name));
document.querySelector('#result').textContent=`Найдено: ${a.length}`;document.querySelector('#count').textContent=`${parts.length} позиций`;
document.querySelector('#grid').innerHTML=a.length?a.map(x=>`<article class="card"><div class="photo">${x.photo?`<img src="${x.photo}" alt="${x.name}" loading="lazy">`:'<span class="small">Фото нет</span>'}</div><div class="photo-note">Фото из предоставленного прайс-листа</div><span class="tag">${x.category}</span><div class="sku">${x.sku}</div><div class="name">${x.name}</div><div class="en">${x.name_en}</div><div class="compat">Совместимость: <b>${x.compatibility.join(', ')}</b></div><div class="bottom"><div><div class="price">${fmt(x.price)}</div><div class="small">цена с НДС · наличие уточняется</div></div><button class="primary" onclick="add('${x.sku}')">В корзину</button></div></article>`).join(''):`<div class="empty">По вашему запросу ничего не найдено.</div>`}
function add(s){cart[s]=(cart[s]||0)+1;localStorage.setItem('agrasCart',JSON.stringify(cart));updateCart()}
function updateCart(){document.querySelector('#cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
[q,cat,sort].forEach(e=>e.addEventListener('input',render));document.querySelector('#clear').onclick=()=>{q.value='';cat.value='';sort.value='default';render()};renderCats();render();updateCart();
</script></body></html>
